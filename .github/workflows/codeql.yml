name: CodeQL

# CodeQL non ha un analizzatore PHP: PHP è coperto da PHPStan e dalla suite
# nel workflow "Qualità del codice". Qui si analizzano il JavaScript
# dell'applicazione e i workflow GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Settimanale il lunedì alle 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisi (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # Carica i risultati SARIF di CodeQL.
      actions: read # Legge i metadati dei workflow.
      contents: read # Legge i sorgenti da analizzare.
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Inizializza CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analisi CodeQL
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
