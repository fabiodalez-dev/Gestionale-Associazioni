name: Release

# Al push di un tag v* costruisce il pacchetto installabile (vendor e asset
# inclusi) con bin/build-release.sh e lo pubblica come asset della GitHub
# Release, insieme al suo SHA256. L'aggiornatore in-app (/aggiornamenti)
# scarica esattamente questo asset: <repo>-<tag>.zip e <repo>-<tag>.zip.sha256.
# Avviato a mano (Actions > Release > Run workflow) dalla branch main pubblica
# la versione del file VERSION: il tag v<VERSION> viene creato insieme alla
# release, sul commit costruito. Utile quando non si può pushare il tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# Un tag alla volta, senza annullare una pubblicazione già avviata
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pacchetto:
    name: Pacchetto installabile e GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Crea la GitHub Release e ne carica gli asset.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: PHP 8.4 (versione minima supportata dall'app)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, pdo_mysql, xml, curl, fileinfo, bcmath
          tools: composer:v2
          coverage: none

      # Senza cache npm: il pacchetto pubblicato non deve dipendere da una
      # cache scrivibile da altri workflow (cache poisoning)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Il tag deve coincidere con il file VERSION
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versione="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Avvio manuale: solo da main, e solo per una versione non ancora
            # taggata (un tag esistente si ripubblica rilanciando il suo push)
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "L'avvio manuale pubblica solo dalla branch main (ora: $GITHUB_REF)." >&2
              exit 1
            fi
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$versione" >/dev/null 2>&1; then
              echo "Il tag v$versione esiste già: aggiorna il file VERSION prima di pubblicare." >&2
              exit 1
            fi
            tag="v$versione"
          else
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$versione" ]; then
              echo "Tag $tag ma VERSION contiene $versione: allinea il file VERSION prima di taggare." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Costruisci il pacchetto
        run: bash bin/build-release.sh

      - name: Verifica il pacchetto
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip="releases/gestionale-associazioni-${TAG}.zip"
          test -f "$zip"
          (cd releases && shasum -a 256 -c "$(basename "$zip").sha256")
          unzip -l "$zip" | grep -q "gestionale-associazioni/vendor/autoload.php"
          unzip -l "$zip" | grep -q "gestionale-associazioni/public/build/manifest.json"
          unzip -l "$zip" | grep -q "gestionale-associazioni/index.php"
          ! unzip -l "$zip" | grep -q "gestionale-associazioni/.env$"

      - name: Pubblica la release con il pacchetto
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Un tag con trattino (v1.2.3-rc.1) è una prerelease: non deve
          # diventare "Latest", altrimenti il canale stabile dell'updater
          # (/releases/latest) la proporrebbe a tutte le installazioni
          extra=""
          case "$TAG" in *-*) extra="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release già esistente (es. creata a mano senza asset): si
            # caricano gli asset, ma senza --clobber. Un pacchetto già
            # pubblicato per quel tag non va mai rimpiazzato: le installazioni
            # ne hanno già verificato il digest, e un asset sostituito sarebbe
            # indistinguibile da una manomissione. In quel caso il job fallisce.
            gh release upload "$TAG" releases/*.zip releases/*.sha256
          else
            # --target crea il tag sul commit costruito se non esiste ancora
            # (avvio manuale); con il push del tag è già quello
            gh release create "$TAG" releases/*.zip releases/*.sha256 --title "$TAG" --target "$GITHUB_SHA" --generate-notes $extra
          fi
