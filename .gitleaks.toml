# Configurazione di gitleaks (workflow "Sicurezza e supply chain"): regole
# predefinite più poche eccezioni mirate. Le eccezioni sono globali e non
# legate a una regola (targetRules) perché gitleaks 8.28 ignora in silenzio
# le targetRules quando la configurazione estende quella predefinita.

[extend]
useDefault = true

# Password di prova dei test, tutte nella forma Parola-Parola(-Parola)-NN
# o -AAAA (es. 'Lanterna-Velluto-Fiume-42', 'AreaSoci-Segreta-2026'): la regola
# generica le scambia per chiavi API. Servono entrambe le condizioni, percorso
# e forma del valore.
[[allowlists]]
description = "Password fittizie dei test"
condition = "AND"
paths = ['''^tests/''']
regexes = ['''^[A-Z][A-Za-z]+(-[A-Z][a-z]+){1,3}-(\d{2}|\d{4})$''']

# Librerie di terze parti minificate copiate in public/assets/vendor.
[[allowlists]]
description = "Librerie vendor minificate"
paths = ['''^public/assets/vendor/.*\.min\.js$''']

# Esempio cURL della documentazione API con il segnaposto LA_TUA_API_KEY.
[[allowlists]]
description = "Segnaposto della documentazione API"
regexTarget = "line"
regexes = ['''Bearer LA_TUA_API_KEY''']

# Password fittizia di un test dell'installer nel commit a7b0d2c (poi sostituita
# da una nel formato delle password di prova): resta nella storia della PR,
# che non si riscrive. Eccezione limitata a quel file e a quel valore.
[[allowlists]]
description = "Password fittizia storica di InstallerServiceTest"
condition = "AND"
paths = ['''^tests/Feature/Installer/InstallerServiceTest\.php$''']
regexes = ['''^Abc123generata$''']
